<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>⛽ GasApp - Control de Combustible y Servicios</title>
    <meta name="description" content="Control de combustible, rendimiento de gasolina, calculadora de viaje y mantenimientos." />
    <!-- PWA CONFIGURACIÓN -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GasApp">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js')
            .then(function(reg) { console.log('✅ Service Worker registrado'); })
            .catch(function(err) { console.log('❌ Error al registrar SW:', err); });
        });
      }
    </script>
  </body>
</html>

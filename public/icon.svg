<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Pure White Background -->
  <rect width="512" height="512" fill="#ffffff" />

  <!-- Centered Minimalist Fuel Pump Icon (Single Color #2563eb, Perfectly Centered) -->
  <g fill="#2563eb">
    <!-- Pedestal / Base -->
    <rect x="166" y="380" width="180" height="16" rx="6" />

    <!-- Main Pump Body -->
    <rect x="176" y="110" width="160" height="280" rx="28" />

    <!-- Inner Cutout / Screen Area (White cutout for contrast) -->
    <rect x="206" y="145" width="100" height="70" rx="12" fill="#ffffff" />

    <!-- Screen Details (Single color bars inside screen) -->
    <rect x="226" y="165" width="60" height="8" rx="3" fill="#2563eb" />
    <rect x="240" y="183" width="32" height="8" rx="3" fill="#2563eb" />

    <!-- Keypad buttons area -->
    <rect x="216" y="235" width="80" height="110" rx="8" fill="#ffffff" />
    <circle cx="236" cy="260" r="7" fill="#2563eb" />
    <circle cx="256" cy="260" r="7" fill="#2563eb" />
    <circle cx="276" cy="260" r="7" fill="#2563eb" />
    <circle cx="236" cy="285" r="7" fill="#2563eb" />
    <circle cx="256" cy="285" r="7" fill="#2563eb" />
    <circle cx="276" cy="285" r="7" fill="#2563eb" />
    <circle cx="236" cy="310" r="7" fill="#2563eb" />
    <circle cx="256" cy="310" r="7" fill="#2563eb" />
    <circle cx="276" cy="310" r="7" fill="#2563eb" />

    <!-- Hose & Nozzle (Right side) -->
    <path d="M336 170 C370 170, 390 200, 390 260 L390 320 C390 338, 376 352, 358 352" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Nozzle Handle -->
    <path d="M340 330 L320 300 L330 290 L350 315 Z" />
    <line x1="320" y1="300" x2="305" y2="275" stroke="#2563eb" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>

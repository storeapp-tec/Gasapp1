<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Indigo & Royal Blue) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Pump Body Gradient (Vibrant Clean White-Cyan) -->
    <linearGradient id="pumpGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Display Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Fuel Drop Accent Gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Soft Drop Shadow for Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 1. Background Fill (Full canvas for seamless adaptive circle/squircle masks) -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Subtle glow ring inside safe area -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#60a5fa" stroke-opacity="0.2" stroke-width="2" />

  <!-- 2. Centered Gas Station Dispenser / Pump Graphic (Center of gravity: X=256, Y=256) -->
  <g filter="url(#shadow)">
    <!-- Dispenser Base / Pedestal -->
    <rect x="146" y="360" width="168" height="20" rx="8" fill="#cbd5e1" />

    <!-- Main Pump Body (Centered between 156 and 304, width 148; with hose on right up to 356 -> total center ~256) -->
    <rect x="156" y="125" width="148" height="235" rx="28" fill="url(#pumpGrad)" stroke="#e2e8f0" stroke-width="4" />

    <!-- Pump Top Indicator Light Bar / Brand header -->
    <rect x="176" y="142" width="108" height="12" rx="6" fill="#3b82f6" />

    <!-- Digital Display Screen (Centered on pump body) -->
    <rect x="172" y="168" width="116" height="74" rx="14" fill="url(#screenGrad)" stroke="#1e293b" stroke-width="2" />

    <!-- Gauge arc on display -->
    <path d="M196 216 A 18 18 0 0 1 264 216" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    <circle cx="230" cy="216" r="5" fill="#38bdf8" />
    <line x1="230" y1="216" x2="245" y2="204" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />

    <!-- Fuel Drop Icon in lower section of pump body -->
    <g transform="translate(230, 290)">
      <path d="M0 -22 C0 -22, -18 3, -18 15 C-18 25, -10 33, 0 33 C10 33, 18 25, 18 15 C18 3, 0 -22, 0 -22 Z" fill="url(#dropGrad)" />
      <!-- Drop light reflection -->
      <ellipse cx="-6" cy="14" rx="3.5" ry="6" fill="#ffffff" fill-opacity="0.6" transform="rotate(-25 -6 14)" />
    </g>

    <!-- Fuel Hose & Nozzle (Smooth realistic curve connected to pump right side) -->
    <!-- Hose Outlet Collar -->
    <rect x="302" y="186" width="10" height="18" rx="4" fill="#94a3b8" />
    <!-- Flexible Hose -->
    <path d="M310 195 C345 195, 362 230, 362 290 L362 315 C362 332, 348 344, 334 344 C320 344, 312 332, 312 318 L312 255" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Nozzle Holster & Grip -->
    <path d="M312 255 L300 235 L306 225 L324 240 Z" fill="#475569" />
    <!-- Metal Nozzle Spout pointing downward into holster -->
    <path d="M300 235 L286 210" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
    <circle cx="286" cy="210" r="3.5" fill="#e2e8f0" />
    <!-- Trigger Lever -->
    <path d="M304 238 Q312 245 316 238" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>
</svg>
